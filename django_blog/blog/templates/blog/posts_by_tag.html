{% extends 'blog/base.html' %}

{% block content %}
<h2>Posts tagged with "{{ tag_name }}"</h2>
<a href="{% url 'post-list' %}">All Posts</a>
<div class="post-container">
    {% for post in posts %}
        <article>
            <h3><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h3>
            <p><small>By {{ post.author }} on {{ post.published_date|date:"F d, Y" }}</small></p>
        </article>
    {% empty %}
        <p>No posts with this tag.</p>
    {% endfor %}
</div>
{% endblock %}
